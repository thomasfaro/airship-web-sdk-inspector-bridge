<!--
  Source of truth for the 16 and 32 pixel icons, the sizes the browser puts in
  the toolbar.

  The lens of icon.svg is dropped here: below about 48 pixels the mark and the
  ring collapse into each other and neither reads. What is left is the Airship
  mark alone, in Airship Blue and with no tile behind it, which is the one
  treatment that stays visible on a light and on a dark toolbar alike.
-->
