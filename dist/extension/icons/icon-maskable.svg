<!--
  Source of truth for the maskable icon of the bridge web app.

  Same artwork as icon.svg, laid out for the Android home screen. Android crops
  an installed icon to whatever shape the launcher uses — circle, squircle,
  teardrop — and only guarantees the inner circle of 80% diameter. The kite sits
  in the top-left corner and the lens in the bottom-right, the two spots a
  circular crop eats first, so the whole composition is scaled to 62% and
  centred: its diagonal then stays within the guaranteed circle. The Midnight
  background is full-bleed rather than a rounded tile, since the launcher draws
  the corners itself.
-->
